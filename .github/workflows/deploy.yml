name: CI + Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: bowling-tracker

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bowling-tracker/package-lock.json

      - run: npm ci

      - name: Test
        run: npm test -- --watch=false

      - name: Build
        run: npm run build -- --configuration production

      # GitHub Pages sirve una SPA: cualquier ruta profunda (p. ej. /sessions/x)
      # devuelve 404 y el navegador carga 404.html. Con una copia de index.html
      # el router de Angular retoma la navegación.
      - name: SPA 404 fallback
        run: cp dist/bowling-tracker/browser/index.html dist/bowling-tracker/browser/404.html

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: bowling-tracker/dist/bowling-tracker/browser

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
