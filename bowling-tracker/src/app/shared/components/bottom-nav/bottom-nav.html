<nav class="bottom-nav" aria-label="Navegación principal">
  @for (item of items; track item.path) {
    <a
      class="bottom-nav__item"
      [routerLink]="item.path"
      routerLinkActive="is-active"
      #rla="routerLinkActive"
      [attr.aria-current]="rla.isActive ? 'page' : null"
    >
      <svg class="bottom-nav__icon" viewBox="0 0 24 24" aria-hidden="true"
           fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        @switch (item.icon) {
          @case ('home') {
            <path d="M3 10.5 12 4l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" />
          }
          @case ('games') {
            <path d="M4 7h16M4 12h16M4 17h10" />
          }
          @case ('stats') {
            <path d="M5 21V10M12 21V4M19 21v-7" />
          }
          @case ('arsenal') {
            <circle cx="12" cy="12" r="8.5" />
            <circle cx="9" cy="8.5" r="1.15" fill="currentColor" stroke="none" />
            <circle cx="12.5" cy="8" r="1.15" fill="currentColor" stroke="none" />
          }
          @case ('settings') {
            <circle cx="8" cy="8" r="2" />
            <path d="M2 8h4M10 8h12" />
            <circle cx="16" cy="16" r="2" />
            <path d="M2 16h12M18 16h4" />
          }
        }
      </svg>
      <span class="bottom-nav__label">{{ item.label }}</span>
    </a>
  }
</nav>
