<section class="screen" *transloco="let t">
  <app-back-link to="/competitions" [label]="t('competitions.title')" />

  <header class="screen__head">
    <h1>{{ editing() ? t('competitionForm.editTitle') : t('competitionForm.newTitle') }}</h1>
  </header>

  <form [formGroup]="form" (ngSubmit)="save()" class="form">
    <div class="field">
      <label>{{ t('competitionForm.type') }}</label>
      <div class="seg" role="radiogroup">
        @for (type of types; track type) {
          <button
            type="button"
            role="radio"
            class="seg__opt"
            [attr.aria-checked]="form.controls.type.value === type"
            [class.seg__opt--on]="form.controls.type.value === type"
            (click)="setType(type)"
          >
            {{ t('competitionType.' + type) }}
          </button>
        }
      </div>
    </div>

    <div class="field">
      <label for="name">
        {{ t('competitionForm.name') }}
        <span class="label-tag label-tag--required">{{ t('form.required') }}</span>
      </label>
      <input id="name" class="input" formControlName="name" autocomplete="off" [placeholder]="t('competitionForm.namePlaceholder')" />
    </div>

    <div class="field">
      <label for="season">
        {{ t('competitionForm.season') }}
        <span class="label-tag">{{ t('form.optional') }}</span>
      </label>
      <input id="season" class="input" formControlName="season" [placeholder]="t('competitionForm.seasonPlaceholder')" autocomplete="off" />
    </div>

    <div class="row2">
      <div class="field">
        <label for="start">
          {{ t('competitionForm.startDate') }}
          <span class="label-tag">{{ t('form.optional') }}</span>
        </label>
        <input id="start" class="input" type="date" formControlName="startDate" />
      </div>
      <div class="field">
        <label for="end">
          {{ t('competitionForm.endDate') }}
          <span class="label-tag">{{ t('form.optional') }}</span>
        </label>
        <input id="end" class="input" type="date" formControlName="endDate" />
      </div>
    </div>

    <div class="field">
      <label for="notes">
        {{ t('competitionForm.notes') }}
        <span class="label-tag">{{ t('form.optional') }}</span>
      </label>
      <textarea
        id="notes"
        class="input"
        rows="2"
        formControlName="notes"
        [placeholder]="t('competitionForm.notesPlaceholder')"
      ></textarea>
    </div>

    <button type="submit" class="cta" [disabled]="form.invalid">{{ t('common.save') }}</button>
  </form>

  @if (editing()) {
    <button type="button" class="toggle" (click)="toggleActive()">
      {{ active() ? t('competitionForm.deactivate') : t('competitionForm.reactivate') }}
    </button>
  }
</section>
