<section class="screen" *transloco="let t">
  <app-back-link to="/games" [label]="t('common.backToGames')" />

  <header class="screen__head">
    <h1>{{ t('gameNew.title') }}</h1>
  </header>

  <form [formGroup]="form" (ngSubmit)="start()" class="form">
    <div class="field">
      <label>{{ t('gameNew.sessionType') }}</label>
      <div class="seg" role="radiogroup">
        @for (st of sessionTypes; track st) {
          <button
            type="button"
            role="radio"
            [attr.aria-checked]="type() === st"
            [class.seg__opt--on]="type() === st"
            class="seg__opt"
            (click)="selectType(st)"
          >
            {{ t('sessionType.' + st) }}
          </button>
        }
      </div>
    </div>

    <div class="field">
      <label for="date">{{ t('gameNew.date') }}</label>
      <input id="date" type="date" formControlName="date" class="input" />
    </div>

    @if (type() === 'league' || type() === 'tournament') {
      <div class="field">
        <label for="competition">{{ t('gameNew.competition') }}</label>
        <div class="pick-row">
          <select id="competition" class="input" formControlName="competitionId">
            <option value="">{{ t('gameNew.none') }}</option>
            @for (comp of relevantCompetitions(); track comp.id) {
              <option [value]="comp.id">{{ comp.name }}</option>
            }
          </select>
          <button type="button" class="pick-add" (click)="openQuickCreate()" [attr.aria-label]="t('gameNew.addCompetition')">
            +
          </button>
        </div>
      </div>
    }

    @if (venues().length > 0) {
      <div class="field">
        <label for="venue">{{ t('gameNew.venue') }}</label>
        <select id="venue" class="input" formControlName="venueId">
          <option value="">{{ t('gameNew.none') }}</option>
          @for (venue of venues(); track venue.id) {
            <option [value]="venue.id">{{ venue.name }}</option>
          }
        </select>
      </div>
    }

    @if (balls().length > 0) {
      <div class="row2">
        <div class="field">
          <label for="primary">{{ t('gameNew.primaryBall') }}</label>
          <select id="primary" class="input" formControlName="primaryBallId">
            <option value="">{{ t('gameNew.none') }}</option>
            @for (ball of balls(); track ball.id) {
              <option [value]="ball.id">{{ ball.name }}</option>
            }
          </select>
        </div>
        <div class="field">
          <label for="spare">{{ t('gameNew.spareBall') }}</label>
          <select id="spare" class="input" formControlName="spareBallId">
            <option value="">{{ t('gameNew.none') }}</option>
            @for (ball of balls(); track ball.id) {
              <option [value]="ball.id">{{ ball.name }}</option>
            }
          </select>
        </div>
      </div>
    }

    <div class="field">
      <label>{{ t('gameNew.detailLevel') }}</label>
      <div class="options" role="radiogroup">
        @for (level of detailLevels; track level) {
          <button
            type="button"
            role="radio"
            [attr.aria-checked]="form.controls.detailLevel.value === level"
            [class.option--on]="form.controls.detailLevel.value === level"
            class="option"
            (click)="selectLevel(level)"
          >
            <b>{{ t('detailLevel.' + level + '.name') }}</b>
            <small>{{ t('detailLevel.' + level + '.hint') }}</small>
          </button>
        }
      </div>
    </div>

    <button type="submit" class="cta" [disabled]="saving()">
      {{ t('gameNew.start') }}
    </button>
  </form>

  @if (showQuickCreate()) {
    <div class="backdrop" (click)="showQuickCreate.set(false)">
      <div class="dialog" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
        <h2 class="dialog__title">{{ t('gameNew.newCompetitionTitle') }}</h2>
        <div class="field">
          <label for="qname">
            {{ t('competitionForm.name') }}
            <span class="label-tag label-tag--required">{{ t('form.required') }}</span>
          </label>
          <input
            id="qname"
            class="input"
            [placeholder]="t('gameNew.competitionNamePlaceholder')"
            [ngModel]="quickName()"
            (ngModelChange)="quickName.set($event)"
            [ngModelOptions]="{ standalone: true }"
          />
        </div>
        <div class="field">
          <label for="qseason">
            {{ t('competitionForm.season') }}
            <span class="label-tag">{{ t('form.optional') }}</span>
          </label>
          <input
            id="qseason"
            class="input"
            [placeholder]="t('gameNew.seasonPlaceholder')"
            [ngModel]="quickSeason()"
            (ngModelChange)="quickSeason.set($event)"
            [ngModelOptions]="{ standalone: true }"
          />
        </div>
        <div class="dialog__actions">
          <button type="button" class="btn btn--ghost" (click)="showQuickCreate.set(false)">
            {{ t('common.cancel') }}
          </button>
          <button
            type="button"
            class="btn"
            [disabled]="!quickName().trim() || creatingCompetition()"
            (click)="quickCreateCompetition()"
          >
            {{ t('common.save') }}
          </button>
        </div>
      </div>
    </div>
  }
</section>
