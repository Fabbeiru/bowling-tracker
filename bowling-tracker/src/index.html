<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Bowling Tracker</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#EEF3FA" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0B0D12" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Registro de partidas de bowling y estadísticas. Tus datos, en tu dispositivo.">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
  <script>
    // Fija el tema antes de la primera pintura (evita el parpadeo del tema
    // equivocado). Misma lógica que fabbeiru.github.io/Portfolio.
    (function () {
      var saved = localStorage.getItem('theme');
      var theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
